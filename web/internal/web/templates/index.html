<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <title>Buy the Rumor</title>
  <link rel="preload" href="/static/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/stage.js" defer></script>
</head>
<body>
  <header class="site-header">
    <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M14 9 L24 14 L14 19 L4 14 Z" fill="#8AA66B"/><path d="M4 14 L14 19 V30 L4 25 Z" fill="#4F6B3A"/><path d="M24 14 L14 19 V30 L24 25 Z" fill="#6E8A52"/><g fill="none" stroke="#4F6B3A" stroke-width="1.3" stroke-linecap="round"><path d="M24 10 L27.5 3.5"/><path d="M27.5 3.5 L25.6 1.2 M27.5 3.5 L28.4 0.8 M27.5 3.5 L30.2 2.2"/></g></svg>
    <span class="wordmark">Buy the Rumor</span>
  </header>

  <main>
    <section class="intro" id="intro">
      <div class="intro-sticky">
        <div class="copy">
          <h1 id="headline">Harvest an agentic trading strategy.</h1>
          <p id="subline">Pick a sector. Our agents keep the signal and drop the rest.</p>
        </div>

        <div class="stage" id="stage" aria-hidden="true">
          <svg class="ghost" id="ghost" viewBox="0 0 1040 560" preserveAspectRatio="none"><g fill="none" stroke="#C9BF9F" stroke-width="1.2" stroke-dasharray="4 6"><path d="M520 140 L658.6 220 L658.6 380 L520 460 L381.4 380 L381.4 220 Z"/><path d="M520 300 L520 460 M520 300 L658.6 220 M520 300 L381.4 220"/></g></svg>
        </div>

        <form class="bar" id="bar" hx-post="/briefs" hx-target="#result" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]">
          <div class="bar-row">
            <label for="theme" class="sr-only">Sector</label>
            <input id="theme" name="theme" class="prompt" type="text" maxlength="100" required autocomplete="off" placeholder="Type a sector, e.g. Semiconductors">
            <button type="submit" class="go">Grow strategy</button>
          </div>
          <div class="chips" role="group" aria-label="Sectors">
            <button type="button" class="chip" data-sector="Technology" aria-pressed="false">Technology</button>
            <button type="button" class="chip" data-sector="Macro / Interest rates" aria-pressed="false">Macro / Interest rates</button>
            <button type="button" class="chip" data-sector="Commodities" aria-pressed="false">Commodities</button>
            <button type="button" class="chip" data-sector="Biotech" aria-pressed="false">Biotech</button>
            <button type="button" class="chip" data-sector="Crypto" aria-pressed="false">Crypto</button>
          </div>
          <div class="risk-row">
            <label for="risk">Risk</label>
            <input id="risk" name="risk_level" class="risk" type="range" min="0" max="100" step="1" value="40" aria-valuetext="40 out of 100, Balanced">
            <output for="risk" id="risk-out" class="risk-out"><span class="mono">40</span> · Balanced</output>
          </div>
        </form>

        <div class="status" id="status" hidden>
          <span class="status-line" id="status-line" aria-live="polite">Starting…</span>
          <div class="segs" id="segs" aria-hidden="true"><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>
          <span class="status-meta" id="status-meta"></span>
          <a class="ghost-btn" id="retry" href="/" hidden>Try again</a>
        </div>

        <div class="result" id="result"></div>

        <div class="cue" id="cue" aria-hidden="true">
          <span>Scroll to cut through the noise</span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 L9 12 L14 7"/></svg>
        </div>
      </div>
    </section>

    <section class="brief-view" id="brief-view" hidden></section>
  </main>
</body>
</html>
