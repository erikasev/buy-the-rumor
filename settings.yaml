version: "1.0"
project_name: "agent"
environment: "development" # "development" (testnet/sandbox) | "production"

# ---------------------------------------------------------
# LLM Orchestrator Configuration
# ---------------------------------------------------------
agent:
  provider: "openrouter" # all LLM calls go through OpenRouter (OPENROUTER_API_KEY)
  base_url: "https://openrouter.ai/api/v1"
  models: # OpenRouter model IDs (<vendor>/<model>)
    cheap: "google/gemini-2.5-flash-lite" # theme mapping: reads the user's rules, picks accounts
    strong: "google/gemini-2.5-flash" # strategist: research leads, overview and risks
  temperature: 0.1 # Low temperature for disciplined, deterministic trade evaluation
  timeout_seconds: 60 # per LLM call; the SDK retries twice with backoff
  max_output_tokens: 4000 # per call; on thinking models this includes reasoning tokens
  reasoning_max_tokens: 1024 # strategist only: cap on hidden reasoning (billed as output); 0 turns it off
  fallback_models: # OpenRouter switches to these, in order, when a model is rate-limited or down
    cheap: ["openai/gpt-4o-mini"]
    strong: ["openai/gpt-4o"]
  max_iterations: 10 # Safety limit on reasoning loop steps per turn
  system_instructions: |
    You are a risk-averse execution agent. Always verify guardrails
    before requesting quote generation or signing a transaction.

# ---------------------------------------------------------
# Worker pipeline
# ---------------------------------------------------------
worker:
  top_accounts: 5 # accounts the LLM picks per theme
  lookback_days: 3 # how far back to collect posts
  max_posts_per_account: 10 # per account, both when collecting and when reading the cache
  max_sources: 60 # posts sent to the strategist, newest first (bounds cost)
  data_max_age_hours: 6 # a collected-data/ batch older than this is ignored; fresh posts are collected instead
  brief_validity_hours: 6 # expires_at = generated_at + this (hard cap 24)

# ---------------------------------------------------------
# Sources
# ---------------------------------------------------------
# Which sources we use is private (ADR-0001) and not kept in the repo. The followed accounts
# and the collector's API details live in the bucket at these keys; edit those files to
# change them (read fresh for every job).
sources_key: "config/sources.json"
collector_key: "config/collector.json"

# ---------------------------------------------------------
# AWS (env vars BRIEFS_BUCKET_NAME, JOBS_TABLE_NAME, JOBS_QUEUE_URL, AWS_REGION override these)
# ---------------------------------------------------------
region: "us-east-2"
bucket_name: "hackathon-btr-351611731335-us-east-2-an"
dynamodb: "arn:aws:dynamodb:us-east-2:351611731335:table/buy-the-rumor"
sqs: "https://sqs.us-east-2.amazonaws.com/351611731335/erika-sqs"

